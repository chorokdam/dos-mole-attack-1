<head>

  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      background: #000;
      color: #00ff00;
      font-family: "Courier New", Courier, monospace;
      text-align: center;
      -webkit-text-size-adjust: 100%;
    }

    body {
      padding: 20px;
      user-select: none;
      -webkit-user-select: none;
      overscroll-behavior: none;
    }

    h1 {
      font-size: clamp(1.15rem, 6vw, 2rem);
      text-shadow: 0 0 10px #00ff00;
      margin: 0 0 5px;
      white-space: nowrap;
    }

    .subtitle {
      color: #00aa00;
      margin-bottom: 20px;
      font-size: .9rem;
    }

    .status-panel {
      font-size: 1.2rem;
      margin-bottom: 20px;
      border: 2px dashed #00ff00;
      display: inline-block;
      padding: 10px 20px;
      background: #051105;
    }

    .status-item {
      margin: 5px 15px;
      display: inline-block;
    }

    .game-board {
      display: grid;
      grid-template-columns: repeat(3, 100px);
      grid-template-rows: repeat(3, 100px);
      gap: 15px;
      justify-content: center;
      margin: 20px auto;
      touch-action: none;
      -ms-touch-action: none;
      -webkit-tap-highlight-color: transparent;
    }

    .hole {
      background: #112211;
      border: 3px solid #00aa00;
      position: relative;
      overflow: hidden;
      cursor: crosshair;
      border-radius: 5px;
      touch-action: none;
      -ms-touch-action: none;
      -webkit-tap-highlight-color: transparent;
    }

    .mole {
      width: 100%;
      height: 100%;
      background: #00ff00;
      position: absolute;
      bottom: -100%;
      transition: bottom .1s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #000;
      font-weight: bold;
      font-size: 1.5rem;
      touch-action: none;
      -ms-touch-action: none;
      -webkit-tap-highlight-color: transparent;
    }

    .mole.up { bottom: 0; }

    .btn {
      background: #000;
      color: #00ff00;
      border: 2px solid #00ff00;
      padding: 10px 20px;
      font-size: 1.1rem;
      font-family: inherit;
      cursor: pointer;
      box-shadow: 0 0 5px #00ff00;
      margin-top: 10px;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }

    .btn:hover {
      background: #00ff00;
      color: #000;
    }

    .game-over-screen {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, .9);
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 10;
    }
  </style>
</head>
<body>
  <h1>[ DOS MOLE ATTACK ]</h1>
  <div class="subtitle">C:\GAMES\MOLE&gt; RUN GAME</div>

  <div class="status-panel">
    <div class="status-item">SCORE: <span id="score">000</span></div>
    <div class="status-item">TIME: <span id="time-left">30</span>s</div>
  </div>

  <div class="game-board" id="game-board">
    <div class="hole"><div class="mole">O_O</div></div>
    <div class="hole"><div class="mole">O_O</div></div>
    <div class="hole"><div class="mole">O_O</div></div>
    <div class="hole"><div class="mole">O_O</div></div>
    <div class="hole"><div class="mole">O_O</div></div>
    <div class="hole"><div class="mole">O_O</div></div>
    <div class="hole"><div class="mole">O_O</div></div>
    <div class="hole"><div class="mole">O_O</div></div>
    <div class="hole"><div class="mole">O_O</div></div>
  </div>

  <button class="btn" id="start-btn">START GAME</button>

  <div class="game-over-screen" id="game-over">
    <h1>=== GAME OVER ===</h1>
    <p style="font-size:1.5rem;margin:20px 0">
      YOUR FINAL SCORE: <span id="final-score">0</span>
    </p>
    <button class="btn" id="restart-btn">RETRY (Y/N)</button>
  </div>

  <script>
    const holes = document.querySelectorAll('.hole');
    const moles = document.querySelectorAll('.mole');
    const scoreBoard = document.getElementById('score');
    const timeLeftDisplay = document.getElementById('time-left');
    const startBtn = document.getElementById('start-btn');
    const gameOverScreen = document.getElementById('game-over');
    const finalScoreDisplay = document.getElementById('final-score');
    const restartBtn = document.getElementById('restart-btn');
    const gameBoard = document.getElementById('game-board');

    let lastHole;
    let timeUp = false;
    let score = 0;
    let countdown;
    let moleTimer;
    let timeLeft = 30;
    let bgmTimer = null;
    let bgmStep = 0;

    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function playBgmNote(freq, duration = 0.12) {
      if (timeUp || audioCtx.state !== 'running') return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.type = 'square';
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.035, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
      osc.start();
      osc.stop(audioCtx.currentTime + duration);
    }

    function startBgm() {
      stopBgm();
      bgmStep = 0;
      const melody = [
        261.63, 329.63, 392, 329.63,
        293.66, 349.23, 440, 349.23,
        261.63, 329.63, 392, 523.25,
        440, 392, 329.63, 293.66
      ];

      const tick = () => {
        if (timeUp) return;
        playBgmNote(melody[bgmStep++ % melody.length], 0.11);
        bgmTimer = setTimeout(tick, 170);
      };
      tick();
    }

    function stopBgm() {
      if (bgmTimer) {
        clearTimeout(bgmTimer);
        bgmTimer = null;
      }
    }

    function playHitSound() {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.type = 'sine';
      osc.frequency.setValueAtTime(300, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(900, audioCtx.currentTime + 0.08);
      gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.08);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.08);
    }

    function playGameOverSound() {
      [440, 349.23, 293.66, 220].forEach((freq, i) => {
        setTimeout(() => {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.type = 'triangle';
          osc.frequency.value = freq;
          gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
          osc.start();
          osc.stop(audioCtx.currentTime + 0.2);
        }, i * 140);
      });
    }

    function randomHole() {
      const hole = holes[Math.floor(Math.random() * holes.length)];
      if (hole === lastHole) return randomHole();
      lastHole = hole;
      return hole;
    }

    function peep() {
      const duration = Math.random() * 500 + 400;
      const mole = randomHole().querySelector('.mole');
      mole.textContent = 'O_O';
      mole.classList.add('up');

      moleTimer = setTimeout(() => {
        mole.classList.remove('up');
        if (!timeUp) peep();
      }, duration);
    }

    function startGame() {
      if (audioCtx.state === 'suspended') audioCtx.resume();

      clearInterval(countdown);
      clearTimeout(moleTimer);

      moles.forEach(mole => {
        mole.classList.remove('up');
        mole.textContent = 'O_O';
      });

      score = 0;
      timeLeft = 30;
      timeUp = false;

      scoreBoard.textContent = '000';
      timeLeftDisplay.textContent = timeLeft;
      gameOverScreen.style.display = 'none';
      startBtn.style.display = 'none';

      peep();
      startBgm();

      countdown = setInterval(() => {
        timeLeft--;
        timeLeftDisplay.textContent = timeLeft;

        if (timeLeft <= 0) {
          clearInterval(countdown);
          timeUp = true;
          endGame();
        }
      }, 1000);
    }

    function endGame() {
      stopBgm();
      clearTimeout(moleTimer);
      moles.forEach(mole => mole.classList.remove('up'));
      playGameOverSound();
      gameOverScreen.style.display = 'flex';
      finalScoreDisplay.textContent = score;
      startBtn.style.display = 'inline-block';
      startBtn.textContent = 'RESTART';
    }

    function bonk(event) {
      event.preventDefault();
      const mole = event.currentTarget;
      if (timeUp || !mole.classList.contains('up') || mole.textContent === 'X_X') return;

      playHitSound();
      score += 10;
      mole.textContent = 'X_X';
      scoreBoard.textContent = String(score).padStart(3, '0');

      setTimeout(() => {
        mole.classList.remove('up');
      }, 120);
    }

    // pointerdown을 사용해 모바일 빠른 연속 탭에서 더블탭 확대를 피함
    moles.forEach(mole => mole.addEventListener('pointerdown', bonk));

    startBtn.addEventListener('click', startGame);
    restartBtn.addEventListener('click', startGame);

    // 게임판 자체의 브라우저 확대/스크롤 제스처 차단
    gameBoard.addEventListener('touchstart', e => e.preventDefault(), { passive: false });
    gameBoard.addEventListener('touchmove', e => e.preventDefault(), { passive: false });
    gameBoard.addEventListener('dblclick', e => e.preventDefault());
  </script>
</body>
</html>
