<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOS MOLE ATTACK</title>

    <!-- Open Graph: 카카오톡/문자/SNS 링크 미리보기 -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="DOS MOLE ATTACK">
    <meta property="og:description" content="30초 동안 두더지를 잡아라! 최고 점수에 도전해보세요.">
    <meta property="og:url" content="https://dos-mole-attack-1.vercel.app/">
    <meta property="og:image" content="https://dos-mole-attack-1.vercel.app/preview.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="DOS MOLE ATTACK 게임 미리보기">
    <meta name="twitter:card" content="summary_large_image">

    <style>
        body {
            background-color: #000000;
            color: #00ff00;
            font-family: 'Courier New', Courier, monospace;
            text-align: center;
            margin: 0;
            padding: 20px;
            user-select: none;
        }

        h1 {
            font-size: clamp(1.15rem, 6vw, 2rem);
            text-shadow: 0 0 10px #00ff00;
            margin-bottom: 5px;
            white-space: nowrap;
        }

        .subtitle {
            color: #00aa00;
            margin-bottom: 20px;
            font-size: 0.9rem;
        }

        .status-panel {
            font-size: 1.2rem;
            margin-bottom: 20px;
            border: 2px dashed #00ff00;
            display: inline-block;
            padding: 10px 20px;
            background-color: #051105;
        }

        .status-item {
            margin: 5px 15px;
            display: inline-block;
        }

        .game-board {
            display: grid;
            grid-template-columns: repeat(3, 100px);
            grid-template-rows: repeat(3, 100px);
            gap: 15px;
            justify-content: center;
            margin: 20px auto;
        }

        .hole {
            background-color: #112211;
            border: 3px solid #00aa00;
            position: relative;
            overflow: hidden;
            cursor: crosshair;
            border-radius: 5px;
        }

        .mole {
            width: 100%;
            height: 100%;
            background-color: #00ff00;
            position: absolute;
            bottom: -100%;
            transition: bottom 0.1s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #000000;
            font-weight: bold;
            font-size: 1.5rem;
        }

        .mole.up {
            bottom: 0;
        }

        .btn {
            background-color: #000000;
            color: #00ff00;
            border: 2px solid #00ff00;
            padding: 10px 20px;
            font-size: 1.1rem;
            font-family: inherit;
            cursor: pointer;
            box-shadow: 0 0 5px #00ff00;
            margin-top: 10px;
        }

        .btn:hover {
            background-color: #00ff00;
            color: #000000;
        }

        .game-over-screen {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.9);
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }

        /* 모바일 게임 터치 시 더블탭 확대/하이라이트 방지 */
        .game-board,
        .hole,
        .mole,
        .btn {
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }

    </style>
</head>
<body>

    <h1>[ DOS MOLE ATTACK ]</h1>
    <div class="subtitle">C:\GAMES\MOLE&gt; RUN GAME</div>

    <div class="status-panel">
        <div class="status-item">SCORE: <span id="score">000</span></div>
        <div class="status-item">TIME: <span id="time-left">30</span>s</div>
    </div>

    <div class="game-board">
        <div class="hole"><div class="mole">O_O</div></div>
        <div class="hole"><div class="mole">O_O</div></div>
        <div class="hole"><div class="mole">O_O</div></div>
        <div class="hole"><div class="mole">O_O</div></div>
        <div class="hole"><div class="mole">O_O</div></div>
        <div class="hole"><div class="mole">O_O</div></div>
        <div class="hole"><div class="mole">O_O</div></div>
        <div class="hole"><div class="mole">O_O</div></div>
        <div class="hole"><div class="mole">O_O</div></div>
    </div>

    <button class="btn" id="start-btn">START GAME</button>

    <div class="game-over-screen" id="game-over">
        <h1>=== GAME OVER ===</h1>
        <p style="font-size: 1.5rem; margin: 20px 0;">
            YOUR FINAL SCORE: <span id="final-score">0</span>
        </p>
        <button class="btn" id="restart-btn">RETRY (Y/N)</button>
    </div>

    <script>
        const holes = document.querySelectorAll('.hole');
        const moles = document.querySelectorAll('.mole');
        const scoreBoard = document.getElementById('score');
        const timeLeftDisplay = document.getElementById('time-left');
        const startBtn = document.getElementById('start-btn');
        const gameOverScreen = document.getElementById('game-over');
        const finalScoreDisplay = document.getElementById('final-score');
        const restartBtn = document.getElementById('restart-btn');

        let lastHole;
        let timeUp = false;
        let score = 0;
        let countdown;
        let moleTimer;
        let timeLeft = 30;

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        let bgmTimer = null;
        let bgmStep = 0;

        function playBgmNote(freq, duration = 0.12) {
            if (timeUp || audioCtx.state !== 'running') return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.type = 'square';
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.035, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        }

        function startBgm() {
            stopBgm();
            bgmStep = 0;
            const melody = [
                261.63, 329.63, 392.00, 329.63,
                293.66, 349.23, 440.00, 349.23,
                261.63, 329.63, 392.00, 523.25,
                440.00, 392.00, 329.63, 293.66
            ];

            const tick = () => {
                if (timeUp) return;
                playBgmNote(melody[bgmStep % melody.length], 0.11);
                bgmStep++;
                bgmTimer = setTimeout(tick, 170);
            };
            tick();
        }

        function stopBgm() {
            if (bgmTimer) {
                clearTimeout(bgmTimer);
                bgmTimer = null;
            }
        }

        function playHitSound() {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.type = 'sine';
            osc.frequency.setValueAtTime(300, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(900, audioCtx.currentTime + 0.08);
            gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.08);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.08);
        }

        function playGameOverSound() {
            const notes = [440.00, 349.23, 293.66, 220.00];
            notes.forEach((freq, index) => {
                setTimeout(() => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.type = 'triangle';
                    osc.frequency.value = freq;
                    gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.2);
                }, index * 140);
            });
        }

        function randomHole(holes) {
            const idx = Math.floor(Math.random() * holes.length);
            const hole = holes[idx];
            if (hole === lastHole) return randomHole(holes);
            lastHole = hole;
            return hole;
        }

        function peep() {
            const time = Math.random() * (900 - 400) + 400;
            const hole = randomHole(holes);
            const mole = hole.querySelector('.mole');

            mole.textContent = 'O_O';
            mole.classList.add('up');

            moleTimer = setTimeout(() => {
                mole.classList.remove('up');
                if (!timeUp) peep();
            }, time);
        }

        function startGame() {
            if (audioCtx.state === 'suspended') audioCtx.resume();

            clearInterval(countdown);
            clearTimeout(moleTimer);

            moles.forEach(m => {
                m.classList.remove('up');
                m.textContent = 'O_O';
            });

            score = 0;
            timeLeft = 30;
            timeUp = false;

            scoreBoard.textContent = '000';
            timeLeftDisplay.textContent = timeLeft;
            gameOverScreen.style.display = 'none';
            startBtn.style.display = 'none';

            peep();
            startBgm();

            countdown = setInterval(() => {
                timeLeft--;
                timeLeftDisplay.textContent = timeLeft;

                if (timeLeft <= 0) {
                    clearInterval(countdown);
                    timeUp = true;
                    endGame();
                }
            }, 1000);
        }

        function endGame() {
            stopBgm();
            clearTimeout(moleTimer);
            moles.forEach(m => m.classList.remove('up'));
            playGameOverSound();
            gameOverScreen.style.display = 'flex';
            finalScoreDisplay.textContent = score;
            startBtn.style.display = 'inline-block';
            startBtn.textContent = 'RESTART';
        }

        function bonk(e) {
            if (!e.isTrusted || timeUp || !this.classList.contains('up')) return;
            if (this.textContent === 'X_X') return;

            playHitSound();
            score += 10;
            this.textContent = 'X_X';
            scoreBoard.textContent = String(score).padStart(3, '0');

            setTimeout(() => {
                this.classList.remove('up');
            }, 120);
        }


        // 모바일/브라우저에서 빠른 연속 탭을 확대 동작으로 처리하지 않도록 방지
        document.querySelector('.game-board').addEventListener('dblclick', (e) => {
            e.preventDefault();
        });

        moles.forEach(mole => mole.addEventListener('click', bonk));
        startBtn.addEventListener('click', startGame);
        restartBtn.addEventListener('click', startGame);
    </script>
</body>
</html>
